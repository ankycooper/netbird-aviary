services:
  aviary:
    image: ghcr.io/ankycooper/netbird-aviary:latest
    container_name: aviary
    restart: unless-stopped
    environment:
      # required
      NETBIRD_API_URL: "https://netbird.example.com"
      NETBIRD_API_TOKEN: "${NETBIRD_API_TOKEN}"

      # defaults applied when a label is missing
      NETBIRD_DEFAULT_TARGET_TYPE: "subnet"          # subnet | peer | resource | cluster
      # Reference the target by friendly name OR by ID. Name is resolved via
      # the NetBird API at startup. Either pair works:
      NETBIRD_DEFAULT_NETWORK_NAME: "Home"           # which Network contains the target resource
      NETBIRD_DEFAULT_TARGET_NAME: "Main-net"        # the Network Resource (subnet) name
      # NETBIRD_DEFAULT_NETWORK_ID: "<network-id>"
      # NETBIRD_DEFAULT_TARGET_ID:  "<resource-id>"
      NETBIRD_DEFAULT_HOST: "100.64.0.1"             # docker host's IP on the NetBird overlay
      NETBIRD_DEFAULT_PROTOCOL: "http"
      NETBIRD_DEFAULT_MODE: "http"                   # service mode: http (L7) | tcp | udp | tls
      NETBIRD_DEFAULT_DOMAIN: "example.com"          # bare-subdomain labels expand to <sub>.example.com

      # ---- target_mode ----
      # "host"    (default): targets the docker host's IP + the host-published
      #                      port that maps to the container. Requires containers
      #                      to publish ports on the host. Simplest.
      # "network" (new):     targets the container's IP on a shared docker network,
      #                      using its INTERNAL port. No need to publish ports on
      #                      the host. The controller embeds a netbird agent and
      #                      registers itself as a routing peer for the docker
      #                      subnet. Requires the extras commented below.
      NETBIRD_TARGET_MODE: "host"

      # ---- network-mode extras ----
      # Setting NETBIRD_SETUP_KEY triggers the network-mode bootstrap (embedded
      # netbird agent + auto-provision NetBird Network/Resource/Router), even
      # when TARGET_MODE is "host". This way you can run with host as the default
      # and opt individual containers into network mode via labels.
      NETBIRD_SETUP_KEY: "${NETBIRD_SETUP_KEY}"      # from .env file (omit if you don't need network mode)
      NETBIRD_NETWORK_NAME: "Docker"                  # name for the auto-created NetBird Network
      # NETBIRD_DOCKER_NETWORK: ""                    # leave blank — auto-detected

      LABEL_PREFIX: "netbird"
      RECONCILE_INTERVAL: "5m"
      LOG_LEVEL: "info"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - netbird-state:/var/lib/netbird
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    networks: [appnet]

  # ---- example managed service: single shorthand form ----
  whoami:
    image: traefik/whoami
    container_name: whoami
    ports:
      - "3001:80"
    labels:
      netbird.enable: "true"
      netbird.domain: "testing"                      # -> testing.example.com via NETBIRD_DEFAULT_DOMAIN
      netbird.port: "80"                             # container port; controller resolves to host port 3001
      netbird.private: "true"
      netbird.access_groups: "admins,devs"
      netbird.access.crowdsec: "enforce"
      netbird.access.allow_cidrs: "203.0.113.4/32,10.0.0.0/8"
      netbird.access.block_countries: "RU,CN"
      netbird.advanced.pass_host_header: "true"

  # ---- example managed service: multi-service form ----
  multi:
    image: nginx
    container_name: multi
    ports:
      - "8080:80"
      - "8443:443"
    labels:
      netbird.enable: "true"

      netbird.services.web.domain: "site.example.com"
      netbird.services.web.port: "80"
      netbird.services.web.auth.password: "${MULTI_WEB_PASSWORD}"

      netbird.services.api.domain: "api.example.com"
      netbird.services.api.port: "443"
      netbird.services.api.target.protocol: "https"
      netbird.services.api.target.skip_tls_verify: "true"
      netbird.services.api.auth.sso: "true"
      netbird.services.api.auth.sso_groups: "engineers"
      netbird.services.api.auth.header.X-API-Key: "${MULTI_API_HEADER_KEY}"

  # ---- example ephemeral service: NetBird service is DELETED when this container stops ----
  # Use this pattern for short-lived workloads (preview deploys, batch jobs, demo apps)
  # where leftover disabled Services would clutter the NetBird UI. On next start the
  # controller will create a fresh service.
  ephemeral:
    image: traefik/whoami
    container_name: ephemeral
    ports:
      - "3009:80"
    labels:
      netbird.enable: "true"
      netbird.ephemeral: "true"                      # <-- the only difference from a normal service
      netbird.domain: "ephemeral"                    # -> ephemeral.example.com
      netbird.port: "80"

  # ---- example service in NETWORK MODE: no host port published ----
  # Reachable only via the NetBird overlay. The controller (with NETBIRD_SETUP_KEY set)
  # embeds a netbird agent and routes traffic into appnet directly to this container.
  internal-only:
    image: traefik/whoami
    container_name: internal-only
    networks: [appnet]
    # NOTE: no `ports:` published — reachable only via NetBird overlay
    labels:
      netbird.enable: "true"
      netbird.target_mode: "network"
      netbird.domain: "internal-only.example.com"
      netbird.port: "80"                             # CONTAINER's internal port (not host)
      netbird.private: "true"
      netbird.access_groups: "admins"

networks:
  appnet:
    name: appnet
    # Docker auto-allocates the subnet by default. Pin one if you want a stable CIDR
    # in your NetBird policies:
    # ipam:
    #   config:
    #     - subnet: 172.30.0.0/24

volumes:
  netbird-state:
